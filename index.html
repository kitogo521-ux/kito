<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burger</title>
    <link rel="stylesheet" href="css/all.css">
    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/media.css">
</head>
<body>
    <div class="top-line" aria-hidden="true"></div>

    <header>
        <div class="menu">
            <div class="container">
                <nav class="main-nav" aria-label="Основное меню">
                    <a class="logo" href="#" aria-label="На главную">
                        <span>LEO Shop</span>
                    </a>
                    <ul>
                        <li><a href="#">Корзина</a></li>
                        <li><a href="#">Меню</a></li>
                        <li><a href="#">О нас</a></li>
                        <li><a href="#">Контакты</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <main class="hero">
        <div class="hero-banner" role="img" aria-label="Изображение магазина">
            <button class="carousel-control-prev" id="banner-prev" type="button" aria-label="Предыдущий слайд">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            </button>
            <button class="carousel-control-next" id="banner-next" type="button" aria-label="Следующий слайд">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
            </button>
        </div>
    </main>

    <script>
        const banner = document.querySelector('.hero-banner');
        let isAnimating = false;

        function swipeBanner(direction) {
            if (isAnimating) return;

            isAnimating = true;
            banner.classList.add(`slide-${direction}`);
            window.setTimeout(() => {
                banner.classList.remove(`slide-${direction}`);
                isAnimating = false;
            }, 450);
        }

        document.querySelector('#banner-prev').addEventListener('click', () => swipeBanner('prev'));
        document.querySelector('#banner-next').addEventListener('click', () => swipeBanner('next'));
    </script>
    <script src="js/bootstrap.js"></script>
</body>
</html>
